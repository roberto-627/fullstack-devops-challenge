name: CI

on:
    pull_request: 
        branches: [devel, stage]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node Js
              uses: actions/setup-node@v4
              with:
                node-version-file: .nvmrc

            - name: Install
              run: npm install

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm run test

            - name: Build
              run: npm run build

            